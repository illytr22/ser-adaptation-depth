experiment_name: ablation_center_crop
model_type: wav2vec2
backbone: facebook/wav2vec2-base
mode: full_ft
num_classes: 8
normalize_waveform: true
seeds: [42, 43, 44]
lr_per_fold:
  1: 3.0e-5
  2: 5.0e-5
  3: 1.0e-5
  4: 3.0e-5
  5: 3.0e-5
  6: 5.0e-5
batch_size: 4
epochs: 20
patience: 5
weight_decay: 1.0e-4
weighted_loss: true
train_crop_mode: center
eval_crop_mode: center
clip_duration_sec: 4.0
target_sr: 16000
