experiment_name: w2v2_weighted_sum
model_type: wav2vec2
backbone: facebook/wav2vec2-base
mode: weighted_sum
num_classes: 8
normalize_waveform: true
seeds: [42]
lr: 1.0e-3
batch_size: 8
epochs: 20
patience: 5
weight_decay: 1.0e-4
weighted_loss: true
train_crop_mode: random
eval_crop_mode: center
clip_duration_sec: 4.0
target_sr: 16000
