experiment_name: wavlm_full_ft
model_type: wavlm
backbone: microsoft/wavlm-base-plus
mode: full_ft
num_classes: 8
normalize_waveform: true
seeds: [42, 43, 44]
lr_candidates: [5.0e-6, 1.0e-5, 3.0e-5, 5.0e-5, 1.0e-4]
lr_per_fold:
  1: 3.0e-5
  2: 5.0e-5
  3: 3.0e-5
  4: 5.0e-5
  5: 3.0e-5
  6: 1.0e-5
batch_size: 4
epochs: 20
patience: 5
weight_decay: 1.0e-4
weighted_loss: true
train_crop_mode: random
eval_crop_mode: center
clip_duration_sec: 4.0
target_sr: 16000
